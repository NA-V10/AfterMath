[project]
name = "aftermath-backend"
version = "0.1.0"
description = "AFTERMATH infrastructure resilience platform — backend (SIMULATION ONLY)"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "networkx>=3.4",
  "shapely>=2.0.6",
  "structlog>=24.4",
  "asyncpg>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "hypothesis>=6.120",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "types-networkx",
  "types-shapely",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- tooling
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = ["S101"]   # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.graph.*", "app.core.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: requires PostgreSQL (TEST_DATABASE_URL)"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain core is pure (no web, DB, agents, services)"
type = "forbidden"
source_modules = ["app.graph"]
forbidden_modules = ["app.api", "app.services", "app.database", "fastapi", "sqlalchemy", "app.core.config"]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = ["app.api", "app.services", "app.database", "app.graph"]
